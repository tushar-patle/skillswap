spring:
  application:
      name: leaderboard-service

  datasource:
    url: jdbc:postgresql://localhost:5432/skillswap_db?currentSchema=leaderboard_schema
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
server:
    port: 8083
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/