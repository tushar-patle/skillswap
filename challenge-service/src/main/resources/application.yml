spring:
  application:
    name: challenge-service

  datasource:
    url: jdbc:postgresql://localhost:5432/skillswap_db?currentSchema=challenge_schema
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/